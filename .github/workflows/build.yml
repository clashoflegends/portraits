name: Package portraits

# On a `portraits-*` tag: zip all image content (everything except git/CI/README) into portraits.zip
# and publish it as the Release asset. Counselor pulls releases/latest/download/portraits.zip and
# extracts it flat into the player's portraits folder. Manual runs (workflow_dispatch) just build.

on:
  push:
    tags: ["portraits-*"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the Release on a tag
    steps:
      - uses: actions/checkout@v4

      - name: Zip portraits
        # Excluded from the pack: SOURCE material players never need. The runtime files all live
        # in Pers/.
        #   "Default Portraits 107x151/" - art masters for the recolourable default set (lossless
        #     PNG, house masks, preview sheets, build script), kept so the set can be rebuilt.
        #   "Greek-ready-*" - the delivered Greek fresco set as received: 107x151 PNGs plus 80
        #     nation house masks. The masks are unused, since recolour only runs on the default_
        #     path and a character own portrait loads verbatim; the PNGs are ~3x the size of the
        #     staged JPEGs that actually ship.
        run: zip -r portraits.zip . -x ".git/*" ".github/*" "README.md" "Default Portraits 107x151/*" "Greek-ready-*/*" "Greek-staging/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portraits
          path: portraits.zip
          # On a tag the zip is also published permanently as the Release asset, so this workflow
          # artifact is redundant; keep it 1 day so it does not accrue against the Actions storage quota.
          retention-days: 1

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/portraits-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" portraits.zip
          --repo "${{ github.repository }}"
          --title "Portraits ${{ github.ref_name }}"
          --notes "Character portrait pack. Counselor downloads this as portraits.zip (releases/latest/download/portraits.zip)."
